services:
  # Backend API: Python 3.11+ Django REST Framework with Gunicorn
  - type: web
    name: trooferz-sports-club-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://trooferz-sports-club-frontend.onrender.com,https://trooferz-sports-club.vercel.app"
      - key: DB_ENGINE
        value: "sqlite"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "7"

  # Frontend: React 18 + Vite Static Site
  - type: web
    name: trooferz-sports-club-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trooferz-sports-club-api.onrender.com/api
