name: CI & Automated Deployment

on:
  push:
    branches: [ main, prod-live ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Django REST Framework Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: |
          cd backend
          python manage.py check

      - name: Run Django automated tests (32 tests)
        run: |
          cd backend
          python manage.py test

  build-frontend:
    name: Build React 18 / Vite Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  deploy:
    name: Trigger Automated Deployment
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod-live'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (Optional Webhook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated deployment webhook..."
          curl -s -S -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy webhook triggered successfully."

      - name: Deployment Notification
        run: |
          echo "Automated CI verification passed successfully for commit ${{ github.sha }} on ${{ github.ref_name }}."
